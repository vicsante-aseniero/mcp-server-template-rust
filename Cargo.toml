[package]
name = "mcp-server-template"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
reqwest = { version = "0.12.19", features = ["json"] }
rmcp = { version = "0.1.5", features = ["server"] }  # Using an earlier version that doesn't require edition 2024
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
hyper = "1.0"

[profile.release]
opt-level = 3           # Maximum performance for HTTP handling
lto = "thin"            # Good balance of compile time vs performance
codegen-units = 1       # Better optimization
strip = true            # Smaller binary for deployment
panic = "abort"         # Slightly faster, smaller binary

# Optional: Optimize dev builds slightly for better testing experience
[profile.dev]
opt-level = 1           # Basic optimizations without slowing compile too much
debug = true
debug-assertions = true
codegen-units = 256     # Faster compile times
lto = false             # No link-time optimization for faster dev builds

panic = "unwind"        # Better debugging experience

# Optional: Optimize test builds
[profile.test]
opt-level = 2           # Good balance for tests
debug = true
debug-assertions = true
codegen-units = 16      # Faster test execution
lto = false             # No link-time optimization for tests
incremental = true      # Faster test iterations

panic = "unwind"        # Better debugging experience
